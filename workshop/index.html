<script>
(function(){
let lang=new URLSearchParams(location.search).get('lang');

if(!['ar','en'].includes(lang))lang='ar';
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';

if(lang==='en'){
 document.title='ALQAI LAB — Your First AI Model';
 const texts={activitiesBtn:'My activities ✎',menuBtn:'Scenes ☷',notesBtn:'My notes N',motionBtn:'Motion ◉',fullBtn:'Fullscreen ⛶',prev:'← Previous',next:'Next →',close:'Close ✕'};

 document.querySelector('.tag').textContent='LEARN · TRAIN · EXPERIMENT';
 const durations=document.getElementById('duration');durations.setAttribute('aria-label','Activity duration');

 document.getElementById('resetTimer').setAttribute('aria-label','Reset timer');
}
select.addEventListener('change',()=>{try{localStorage.setItem('alqai-workshop-language',select.value)}catch{}const url=new URL(location.href);url.searchParams.set('lang',select.value);location.assign(url.href)});
const script=document.createElement('script');script.src='app-'+lang+'.js';script.onerror=()=>{document.getElementById('main').textContent=lang==='ar'?'تعذّر تحميل العرض. حدّث الصفحة وحاول مرة ثانية.':'Could not load the presentation. Refresh the page and try again.'};document.body.appendChild(script);
